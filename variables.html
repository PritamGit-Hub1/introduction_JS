<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Variables</title>
    <script>


        console.log("this is Variables");   
        console.log(typeof "Hello"); // string
        console.log(typeof 100); // number
        console.log(typeof true); // boolean
        console.log(typeof undefined); // undefined
        console.log(typeof null); // object (quirk!)
        console.log(typeof {}); // object
        console.log(typeof []); // object (array is also object)
        console.log(typeof function(){});// function

        let a = "pritam";
        console.log(a); // pritam
        let b = 50;
        console.log(b);
        b = 100;
        let c = true;
        console.log(c);
        console.log (b);
        const d = 10;
        console.log(d);
        d = 20;
        console.log(d);  // Not change the value of d because it is a constant variable.

    
    </script>
</head>
<body>
    <p>Understanding how to work variables.</p>
</body>
</html>
