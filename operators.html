<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators in javaScript</title>
    <script>
        console.log("operators in javaScript");
        let a = 10;
        let  b= 5;
        console.log (" a + b = " + (a + b));
        console.log (" a * b = " + (a * b));
        console.log (" a - b = " + (a - b));
        console.log (" a / b = " + (a / b));
        console.log (" a % b = " + (a % b));
        // a++;
        // console.log (" a++ = " + a);
        a--;
        console.log((" a-- = " + a));

        // assignment operators
        let x = 10;
        x += 5; // x = x + 5
        console.log(" x = " + x);
             
        // Comparison Operators
        let d = 20;
        let c = "20";
        console.log(" d == c =" + (d == c));   // equality operator only value should be same.
        console.log(" d === c =" + (d === c)); // strict equality operator Type and value both should be same.
       
        // logical operators
        let e = 30;
        let f = 40;
        console.log(" e > 20 && f < 50 = " + (e > 20 && f < 50)); // true (true && false = false) (false && true = false) (false && false = false) (true && true = true)
        console.log(" e > 20 || f < 50 = " + (e > 20 || f < 50)); // true (true || false = true) (false || true = true) (true || true = true) (false || false = false)
        console.log(" !(e > 20) = " + !(e > 20)); // false

        // ternary operator
        let age = 17;
        let result = age >= 18 ? "Adult" : "Minor";
        console.log(result); // "Minor"

    </script>
</head>
<body>
    <p>
        Code in console for operators in javaScript.
    </p>
</body>
</html>
